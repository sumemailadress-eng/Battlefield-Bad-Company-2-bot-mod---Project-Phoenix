; Project Phoenix BC2 - bot settings. Read once when Start-Bots.bat attaches.
; To change them: edit, save, restart the server, run Start-Bots.bat again.

[Bots]
; Bots on each team (humans are extra). 15 = 15 v 15.
BotsPerTeam=15
; Alternative: fill every team up to this many players including humans (0 = off).
FillTeamsTo=0
; Seconds a bot waits after dying before it redeploys.
RespawnDelay=6
; 1 = easy, 2 = normal, 3 = hard (reaction time, turn speed, aim spread).
Difficulty=2
; Extra multiplier on aim spread: lower = more accurate (0.5 = sharp, 2 = sloppy).
AimError=1.0
Grenades=1

[Navigation]
; Bots map the level with physics rays and plan routes on that grid.
; The first time a map is played this takes a few minutes; it is then saved in navcache\.
Navigation=1
NavCellSize=2.5
NavBuildMsPerTick=5

[Behaviour]
; 1 = bots get every weapon and gadget unlock, so each life picks a random weapon from the kit.
UnlockAll=1
; 1 = gadgets: engineer rockets, assault grenade launcher and ammo, medic medkits, recon motion mines.
Equipment=1
; 1 = medics run to downed human teammates and use the defibrillator.
Revive=1
; Flags: bots attack the flags nearest their side first, one group per GroupSize bots, and move on
; to the next flags as they fall. Lower = more, smaller groups.
GroupSize=4
; Guards on flags already taken: 0 = automatic (more guards as the team holds more flags, ~1 in 9 per flag),
; N = one per N bots, -1 = none (everyone moves on; flags under attack are still defended).
GuardEvery=0
; Vehicles: 0 = never, 1 = ride as passengers, 2 = also drive ground vehicles (experimental).
Vehicles=2
; 1 = bots fly helicopters (each type is tested once by the first pilot to learn its controls), 0 = they don't.
Helicopters=1
; Damage bots do to human players: 1.2 = 20% more than the weapon does (1.0 = normal).
BotDamage=1.2
; 1 = a new bot player gets its team written before it joins (no setTeam announcement).
QuietTeamJoin=1
; A bot pinned in place (wedged in rubble/geometry) this many seconds is redeployed. 0 = never.
FrozenRespawn=30
; 1 = bots learn each map: where they get stuck and what gets them through, where they keep dying (routes avoid
; it), which sniper/window spots work. Kept in navcache\<map>.learn - copy it to share with another server.
Learning=1
; Bots' online identity for the scoreboard: 2 = the persona of their backend account (run backend\Add-Bot-Accounts.bat once),
; 1 = a made-up identity (1.0-1.3), 0 = none.
ScoreboardNames=2
; 1 = bots are grouped in fireteams of four (used with RealSquads).
Fireteams=1
; Following a human player is disabled in 0.7.1 (flags come first). Kept for older ini files.
FollowHuman=0
; 1 = also put bots into the server's own squads (fireteams of four).
RealSquads=1
; 1.5: stationary weapons - bots take an empty mounted gun / launcher near them when no enemy is close to it and
; there is something to shoot at, and leave it when idle or an enemy gets close.
StationaryWeapons=1
; 1.5: boats - bots drive boats along the water towards flags near it and land there (the PBRs on the Vietnam maps).
Boats=1
; 1.5: bots learn from human players - walked routes become preferred routes, and ground a human drove a vehicle over
; becomes drivable for bot drivers. Kept in navcache\<map>.learn with the rest.
LearnFromHumans=1
; 1.5: Rush and Squad Rush - attackers arm the M-COMs, defenders guard them and defuse armed ones (hold Interact).
RushObjectives=1

[Experimental]
; 1.5: a dead bot keeps its player and redeploys, like a human (stops "<bot> switched teams", keeps its score).
; If the log says kept players do not redeploy, Phoenix goes back to a new player per life by itself.
KeepBotPlayers=1

[Debug]
; Seconds between status lines in the log.
StatusEvery=15
; 1 = log every bot decision (big logs).
Verbose=0
; If bots aim at the sky or the floor, set this to -1.
AimPitchSign=1
; 1 = Phoenix runs the server's soldier movement step for bots (needed for them to walk).
; Set 0 only if the server crashes right after bots spawn.
MovementStep=1
